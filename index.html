<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponto — Work / Tack / Rest</title>

<!-- Configurações PWA -->
<meta name="theme-color" content="#0b0f18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- AQUI FOI ALTERADO PARA O SEU ARQUIVO PNG -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#0b0f18;
    --card:#151b29;
    --card2:#1a2233;
    --border:#243049;
    --text:#e8edf7;
    --muted:#8794ab;
    --work:#22c55e;
    --tack:#f59e0b;
    --rest:#3b82f6;
  }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
    background:radial-gradient(1000px 520px at 50% -220px,#1b2740 0%,#0b0f18 70%) fixed,#0b0f18;
    color:var(--text);
    padding:22px 16px 70px;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  .app{max-width:700px;margin:0 auto}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .topbar h1{font-size:22px;margin:0;letter-spacing:.3px}
  .topbar p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  input[type="date"]{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:9px 12px;border-radius:11px;font:inherit;font-size:13.5px;
    color-scheme:dark;cursor:pointer;
  }
  input[type="date"]:focus{outline:2px solid var(--rest);outline-offset:1px}

  .status{
    --accent:var(--muted);
    background:linear-gradient(180deg,#1a2233,#141a27);
    border:1px solid var(--border);border-radius:20px;
    padding:18px 20px 16px;margin-bottom:16px;position:relative;overflow:hidden;
  }
  .status::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent);
    opacity:.9;transition:background .3s;
  }
  .status[data-type="work"]{--accent:var(--work)}
  .status[data-type="tack"]{--accent:var(--tack)}
  .status[data-type="rest"]{--accent:var(--rest)}
  .status-top{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--accent);letter-spacing:.2px}
  .status-top .dot{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
  .timer{
    font-size:clamp(34px,9vw,44px);font-weight:700;letter-spacing:1px;margin:6px 0 2px;
    font-variant-numeric:tabular-nums;color:var(--text);
  }
  .since{font-size:12.5px;color:var(--muted)}

  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .punch{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    padding:20px 8px;border-radius:16px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font:inherit;font-size:13.5px;font-weight:600;
    cursor:pointer;transition:transform .12s ease,border-color .2s,background .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .punch i{width:12px;height:12px;border-radius:50%}
  .punch.work{color:var(--work);border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.08)}
  .punch.tack{color:var(--tack);border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.08)}
  .punch.rest{color:var(--rest);border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08)}
  .punch.work i{background:var(--work);box-shadow:0 0 10px var(--work)}
  .punch.tack i{background:var(--tack);box-shadow:0 0 10px var(--tack)}
  .punch.rest i{background:var(--rest);box-shadow:0 0 10px var(--rest)}
  .punch:active{transform:scale(.96)}
  @media(hover:hover){.punch:hover{transform:translateY(-2px)}}

  .forgot{
    width:100%;margin-top:10px;padding:13px;border-radius:14px;
    border:1px dashed var(--border);background:transparent;color:var(--muted);
    font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.2s;
  }
  .forgot:hover{color:var(--text);border-color:#3a4a6b;background:rgba(255,255,255,.02)}

  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 20px}
  .total{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;display:flex;flex-direction:column;gap:5px;
  }
  .total span{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;color:var(--muted)}
  .total strong{font-size:16px;font-variant-numeric:tabular-nums}
  .total.work strong{color:var(--work)}
  .total.tack strong{color:var(--tack)}
  .total.rest strong{color:var(--rest)}

  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--border);
    background:rgba(255,255,255,.02);
  }
  td{padding:11px 14px;border-bottom:1px solid rgba(36,48,73,.6);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .mono{font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.running .mono:last-of-type{color:var(--text)}
  tr.running td:nth-child(3){font-weight:700}

  .pill{
    display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
    font-size:12.5px;font-weight:600;white-space:nowrap;
  }
  .pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.work{color:var(--work);background:rgba(34,197,94,.12)}
  .pill.tack{color:var(--tack);background:rgba(245,158,11,.12)}
  .pill.rest{color:var(--rest);background:rgba(59,130,246,.14)}

  .badge{
    display:inline-block;margin-left:7px;padding:2px 7px;border-radius:6px;
    font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    color:#fca5a5;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.3);
    vertical-align:middle;
  }
  .note{font-size:11.5px;color:var(--muted);margin-top:4px}

  .acts{text-align:right;white-space:nowrap}
  .icon{
    background:transparent;border:1px solid transparent;color:var(--muted);
    width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px;
    transition:.15s;line-height:1;
  }
  .icon:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .icon.danger:hover{background:rgba(239,68,68,.15);color:#fca5a5}

  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13.5px}

  .footer{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .ghost{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:9px 16px;border-radius:10px;font:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;transition:.2s;
  }
  .ghost:hover{color:var(--text);border-color:#3a4a6b}
  .ghost.danger:hover{color:#fca5a5;border-color:rgba(239,68,68,.4)}

  dialog{
    border:1px solid var(--border);background:var(--card2);color:var(--text);
    border-radius:18px;padding:0;width:min(420px,calc(100vw - 32px));
  }
  dialog::backdrop{background:rgba(5,8,14,.7);backdrop-filter:blur(3px)}
  dialog form{padding:22px}
  dialog h2{margin:0 0 18px;font-size:17px}
  dialog label{display:block;margin-bottom:14px;font-size:12.5px;font-weight:600;color:var(--muted)}
  dialog select,dialog input[type="text"],dialog input[type="time"]{
    display:block;width:100%;margin-top:7px;padding:11px 12px;
    background:var(--card);border:1px solid var(--border);border-radius:11px;
    color:var(--text);font:inherit;font-size:14px;color-scheme:dark;
  }
  dialog select:focus,dialog input:focus{outline:2px solid var(--rest);outline-offset:1px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .modal-actions button{
    padding:11px 20px;border-radius:11px;font:inherit;font-size:13.5px;font-weight:600;
    cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);
    transition:.2s;
  }
  .modal-actions button:hover{color:var(--text)}
  .modal-actions .primary{background:var(--rest);border-color:var(--rest);color:#fff}
  .modal-actions .primary:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div>
      <h1>Ponto</h1>
      <p>Work · Tack · Rest</p>
    </div>
    <input type="date" id="datePicker">
  </header>

  <section class="status" id="statusCard" data-type="">
    <div class="status-top">
      <span class="dot"></span>
      <span id="statusLabel">Sem registro</span>
    </div>
    <div class="timer" id="liveTimer">00:00:00</div>
    <div class="since" id="sinceLabel">Toque em um botão para começar</div>
  </section>

  <section class="actions">
    <button type="button" class="punch work" data-type="work"><i></i>Trabalho</button>
    <button type="button" class="punch tack" data-type="tack"><i></i>Tack break</button>
    <button type="button" class="punch rest" data-type="rest"><i></i>Descanso</button>
  </section>

  <button type="button" class="forgot" id="btnForgot">+ Registrar ponto esquecido</button>

  <section class="totals">
    <div class="total work"><span>Work</span><strong id="totWork">0min</strong></div>
    <div class="total tack"><span>Tack</span><strong id="totTack">0min</strong></div>
    <div class="total rest"><span>Rest</span><strong id="totRest">0min</strong></div>
  </section>

  <section class="table-wrap">
    <table>
      <thead>
        <tr><th>Tipo</th><th>Hora</th><th>Duração</th><th></th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty">Nenhum registro ainda.<br>Toque em um dos botões acima para bater o ponto.</div>
  </section>

  <div class="footer">
    <button type="button" class="ghost" id="btnExport">Exportar CSV</button>
    <button type="button" class="ghost danger" id="btnClear">Limpar dia</button>
  </div>

</div>

<dialog id="modal">
  <form id="entryForm">
    <h2 id="modalTitle">Registrar ponto esquecido</h2>

    <label>Tipo
      <select id="fType">
        <option value="work">Trabalho</option>
        <option value="tack">Tack break</option>
        <option value="rest">Descanso</option>
      </select>
    </label>

    <label>Hora
      <input type="time" id="fTime" required>
    </label>

    <label>Observação (opcional)
      <input type="text" id="fNote" placeholder="ex: tack break das 9h30" maxlength="80">
    </label>

    <div class="modal-actions">
      <button type="button" id="btnCancel">Cancelar</button>
      <button type="submit" class="primary">Salvar</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  "use strict";

  const TYPES = {
    work: { label: "Trabalho" },
    tack: { label: "Tack break" },
    rest: { label: "Descanso" }
  };

  const memoryStore = {};
  function safeGetItem(key) {
    try { return localStorage.getItem(key); } 
    catch (e) { return memoryStore[key] || null; }
  }
  function safeSetItem(key, val) {
    try { localStorage.setItem(key, val); } 
    catch (e) { memoryStore[key] = val; }
  }

  let currentDate = todayStr();
  let entries = [];
  let editingId = null;

  const pad = n => String(n).padStart(2, "0");

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function hms(ms) {
    if (ms == null || ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
  }

  function fmtDur(ms) {
    if (ms == null) return "—";
    if (ms < 0) ms = 0;
    const min = Math.floor(ms / 60000);
    const h = Math.floor(min / 60);
    const m = min % 60;
    return h > 0 ? `${h}h ${pad(m)}min` : `${m}min`;
  }

  function fmtTime(ts) {
    const d = new Date(ts);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function nowTimeValue() {
    const d = new Date();
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  const key = date => "ponto:" + date;

  function load() {
    try {
      const raw = safeGetItem(key(currentDate));
      entries = raw ? JSON.parse(raw) : [];
    } catch (e) {
      entries = [];
    }
    if (!Array.isArray(entries)) entries = [];
  }

  function save() {
    safeSetItem(key(currentDate), JSON.stringify(entries));
  }

  const el = {
    datePicker: document.getElementById("datePicker"),
    statusCard: document.getElementById("statusCard"),
    statusLabel: document.getElementById("statusLabel"),
    liveTimer: document.getElementById("liveTimer"),
    sinceLabel: document.getElementById("sinceLabel"),
    tbody: document.getElementById("tbody"),
    empty: document.getElementById("empty"),
    totWork: document.getElementById("totWork"),
    totTack: document.getElementById("totTack"),
    totRest: document.getElementById("totRest"),
    modal: document.getElementById("modal"),
    modalTitle: document.getElementById("modalTitle"),
    form: document.getElementById("entryForm"),
    fType: document.getElementById("fType"),
    fTime: document.getElementById("fTime"),
    fNote: document.getElementById("fNote"),
    btnForgot: document.getElementById("btnForgot"),
    btnCancel: document.getElementById("btnCancel"),
    btnExport: document.getElementById("btnExport"),
    btnClear: document.getElementById("btnClear")
  };

  function computeRows() {
    const sorted = [...entries].sort((a, b) => a.ts - b.ts);
    const isToday = currentDate === todayStr();
    const now = Date.now();

    return sorted.map((e, i) => {
      const next = sorted[i + 1];
      let dur = null, running = false;

      if (next) {
        dur = next.ts - e.ts;
      } else if (isToday) {
        dur = now - e.ts;
        running = true;
      }
      return Object.assign({}, e, { dur, running });
    });
  }

  function addEntry(type, ts, forgotten, note) {
    entries.push({
      id: uid(),
      type: type,
      ts: ts,
      forgotten: !!forgotten,
      note: note || ""
    });
    save();
    render();
  }

  function render() {
    const rows = computeRows();
    updateTotals(rows);
    updateStatus(rows);
    el.tbody.innerHTML = rows.map(rowHtml).join("");
    el.empty.style.display = rows.length ? "none" : "block";
  }

  function updateTotals(rows) {
    const tot = { work: 0, tack: 0, rest: 0 };
    rows.forEach(r => {
      if (r.dur != null) tot[r.type] = (tot[r.type] || 0) + r.dur;
    });
    el.totWork.textContent = fmtDur(tot.work);
    el.totTack.textContent = fmtDur(tot.tack);
    el.totRest.textContent = fmtDur(tot.rest);
  }

  function updateStatus(rows) {
    const last = rows[rows.length - 1];

    if (!last) {
      el.statusCard.dataset.type = "";
      el.statusLabel.textContent = "Sem registro";
      el.liveTimer.textContent = "00:00:00";
      el.sinceLabel.textContent = "Toque em um botão para começar";
      return;
    }

    el.statusCard.dataset.type = last.type;
    el.statusLabel.textContent = TYPES[last.type].label;
    el.sinceLabel.textContent = "desde " + fmtTime(last.ts);
    el.liveTimer.textContent = last.dur != null ? hms(last.dur) : "--:--:--";
  }

  function rowHtml(r) {
    const t = TYPES[r.type];
    return `<tr class="${r.running ? "running" : ""}">
      <td>
        <span class="pill ${r.type}"><i></i>${t.label}</span>
        ${r.forgotten ? '<span class="badge">esquecido</span>' : ""}
        ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      </td>
      <td class="mono">${fmtTime(r.ts)}</td>
      <td class="mono" id="dur-${r.id}">${r.dur != null ? fmtDur(r.dur) : "—"}</td>
      <td class="acts">
        <button type="button" class="icon" data-edit="${r.id}" title="Editar">&#9998;</button>
        <button type="button" class="icon danger" data-del="${r.id}" title="Excluir">&#10005;</button>
      </td>
    </tr>`;
  }

  function tick() {
    const rows = computeRows();
    const last = rows[rows.length - 1];
    if (!last) return;

    if (last.running) {
      el.liveTimer.textContent = hms(last.dur);
      const cell = document.getElementById("dur-" + last.id);
      if (cell) cell.textContent = fmtDur(last.dur);
      updateTotals(rows);
    }
  }

  function openModal(mode, entry) {
    editingId = entry ? entry.id : null;
    el.modalTitle.textContent = mode === "edit" ? "Editar registro" : "Registrar ponto esquecido";
    el.fType.value = entry ? entry.type : "work";
    el.fTime.value = entry ? fmtTime(entry.ts) : nowTimeValue();
    el.fNote.value = entry ? (entry.note || "") : "";

    if (typeof el.modal.showModal === "function") {
      el.modal.showModal();
    } else {
      el.modal.setAttribute("open", "true");
    }
    el.fTime.focus();
  }

  el.form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    const type = el.fType.value;
    const time = el.fTime.value;
    if (!time) return;

    const parts = time.split(":");
    const d = new Date(currentDate + "T00:00:00");
    d.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);
    const ts = d.getTime();

    if (editingId) {
      const target = entries.find(x => x.id === editingId);
      if (target) {
        target.type = type;
        target.ts = ts;
        target.note = el.fNote.value.trim();
      }
    } else {
      entries.push({
        id: uid(),
        type: type,
        ts: ts,
        forgotten: true,
        note: el.fNote.value.trim()
      });
    }

    save();
    render();
    el.modal.close();
    editingId = null;
  });

  el.btnCancel.addEventListener("click", () => {
    el.modal.close();
    editingId = null;
  });

  document.querySelectorAll(".punch").forEach(btn => {
    btn.addEventListener("click", function () {
      if (currentDate !== todayStr()) {
        currentDate = todayStr();
        el.datePicker.value = currentDate;
        load();
      }
      addEntry(btn.dataset.type, Date.now(), false, "");
    });
  });

  el.btnForgot.addEventListener("click", () => openModal("add", null));

  el.tbody.addEventListener("click", function (ev) {
    const editBtn = ev.target.closest("[data-edit]");
    const delBtn = ev.target.closest("[data-del]");

    if (editBtn) {
      const entry = entries.find(x => x.id === editBtn.dataset.edit);
      if (entry) openModal("edit", entry);
    }

    if (delBtn) {
      if (confirm("Excluir este registro?")) {
        entries = entries.filter(x => x.id !== delBtn.dataset.del);
        save();
        render();
      }
    }
  });

  el.datePicker.addEventListener("change", function (ev) {
    currentDate = ev.target.value || todayStr();
    load();
    render();
  });

  el.btnClear.addEventListener("click", function () {
    if (!entries.length) return;
    if (confirm("Apagar todos os registros de " + currentDate + "?")) {
      entries = [];
      save();
      render();
    }
  });

  el.btnExport.addEventListener("click", function () {
    const rows = computeRows();
    const lines = [["Tipo", "Hora", "Duracao", "Esquecido", "Observacao"]];
    rows.forEach(r => {
      lines.push([
        TYPES[r.type].label,
        fmtTime(r.ts),
        r.dur != null ? fmtDur(r.dur) : "",
        r.forgotten ? "sim" : "",
        r.note || ""
      ]);
    });
    const csv = lines.map(l => l.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ponto-" + currentDate + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  el.datePicker.value = currentDate;
  load();
  render();
  setInterval(tick, 1000);

  // Registrar Service Worker para funcionar Offline e instalar como App
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registrado.', reg.scope))
        .catch(err => console.log('Falha no Service Worker:', err));
    });
  }
})();
</script>
</body>
</html>
